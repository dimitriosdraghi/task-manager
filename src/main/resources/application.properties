spring.application.name=task-manager

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/taskmanager
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT (the default secret is for local development only; set JWT_SECRET in other environments)
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789-abcdefghij}
app.jwt.expiration-ms=3600000
